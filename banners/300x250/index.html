<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>300x250 Carnival Wheel Banner</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap");

    :root{
      --w:300px;
      --h:250px;
      --gold:#f6c35a;
      --cream:#fff3d6;
      --ink:#140b1c;
      --shadow: rgba(0,0,0,0.45);
      --display: "Cinzel Decorative", Georgia, "Times New Roman", serif;
      --ui: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    html,body{ height:100%; margin:0; }
    body{
      display:grid;
      place-items:center;
      background:#111;
      font-family:var(--ui);
    }

    /* The actual banner stage */
    .ad{
      width:var(--w);
      height:var(--h);
      position:relative;
      overflow:hidden;
      background:#120a1f;
      border:1px solid rgba(246,195,90,0.45);
      box-shadow: 0 14px 40px rgba(0,0,0,0.55);
      cursor:pointer;
      user-select:none;
    }

    /* Background photo + blur */
    .bg{
      position:absolute;
      inset:-18px;
      background-image:url("Assets/carnival-background.png");
      background-size:cover;
      background-position:center;
      filter: blur(5px) saturate(1.05) brightness(0.92);
      transform: scale(1.05);
    }

    /* Vignette overlay */
    .vignette{
      position:absolute;
      inset:0;
      background:
        radial-gradient(320px 220px at 50% 35%, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.62) 70%, rgba(0,0,0,0.82) 100%),
        radial-gradient(220px 170px at 50% 45%, rgba(246,195,90,0.11) 0%, rgba(0,0,0,0) 62%);
      pointer-events:none;
    }

    /* Frame */
    .frame{
      position:absolute;
      inset:10px;
      border:2px solid rgba(246,195,90,0.45);
      pointer-events:none;
    }

    /* Header */
    .title{
      position:absolute;
      top:10px;
      left:12px;
      right:12px;
      text-align:center;
      font-family:var(--display);
      font-weight:900;
      letter-spacing:0.6px;
      color:var(--cream);
      text-shadow: 0 2px 10px var(--shadow);
      font-size:18px;
      line-height:1.05;
    }

    .subtitle{
      margin-top:4px;
      font-family:var(--ui);
      font-weight:700;
      letter-spacing:0.2px;
      opacity:0.92;
      font-size:11px;
    }

    /* Wheel area */
    .wheelWrap{
      position:absolute;
      left: 18px;
      top: 62px;
      width: 140px;
      height: 140px;
    }

    .spot{
      position:absolute;
      inset:-12px;
      border-radius:999px;
      background: radial-gradient(circle at 50% 55%, rgba(255,243,214,0.22) 0%, rgba(246,195,90,0.16) 24%, rgba(0,0,0,0) 64%);
      filter: blur(1px);
      pointer-events:none;
    }

    .ring{
      position:absolute;
      inset:0;
      border-radius:999px;
      border:7px solid rgba(246,195,90,0.88);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.35);
      background: rgba(255,255,255,0.02);
      pointer-events:none;
    }

    .wheel{
      position:absolute;
      inset:10px;
      border-radius:999px;
      will-change: transform;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,0.45));
    }

    .pointer{
      position:absolute;
      top:-6px;
      left:50%;
      transform:translateX(-50%);
      width:0; height:0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 22px solid var(--gold);
      filter: drop-shadow(0 2px 0 rgba(0,0,0,0.55));
      z-index:3;
    }

    .pointerCap{
      position:absolute;
      top:14px;
      left:50%;
      transform:translateX(-50%);
      width:10px;
      height:10px;
      background:var(--gold);
      border:2px solid rgba(0,0,0,0.35);
      box-sizing:border-box;
      z-index:3;
    }

    .hub{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:44px;
      height:44px;
      background:var(--cream);
      border:4px solid rgba(246,195,90,0.92);
      color:var(--ink);
      font-family:var(--display);
      font-weight:900;
      font-size:9px;
      letter-spacing:0.7px;
      text-transform:uppercase;
      display:grid;
      place-items:center;
      text-align:center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.35);
      z-index:3;
    }

    /* Right panel */
    .panel{
      position:absolute;
      right:12px;
      top:62px;
      width: 120px;
      height: 140px;
      border:1px solid rgba(246,195,90,0.22);
      background: rgba(0,0,0,0.28);
      padding:10px;
      box-sizing:border-box;
    }

    .panelLabel{
      font-weight:900;
      letter-spacing:0.3px;
      font-size:12px;
      margin:0 0 6px 0;
    }

    .panelResult{
      margin:0;
      font-size:12px;
      line-height:1.25;
      opacity:0.94;
      min-height:56px;
    }

    .cta{
      position:absolute;
      left:10px;
      right:10px;
      bottom:12px;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:center;
    }

    .btn{
      flex:1 1 0;
      height:34px;
      border:2px solid rgba(246,195,90,0.75);
      background: rgba(246,195,90,0.10);
      color:var(--cream);
      font-family:var(--display);
      font-weight:900;
      letter-spacing:0.3px;
      text-transform:uppercase;
      font-size:12px;
      display:grid;
      place-items:center;
      box-sizing:border-box;
    }

    .btn.secondary{
      opacity:0.85;
    }

    .btnHint{
      position:absolute;
      bottom:50px;
      left:12px;
      right:12px;
      text-align:center;
      font-size:10.5px;
      opacity:0.78;
      pointer-events:none;
    }

    /* Confetti canvas sits on top */
    #confettiCanvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
      z-index:10;
    }

    /* Accessibility focus */
    .ad:focus{
      outline: 2px solid rgba(246,195,90,0.85);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce){
      #confettiCanvas{ display:none; }
    }
  </style>
</head>

<body>
  <div class="ad" id="ad" tabindex="0" role="button" aria-label="Interactive carnival wheel banner. Click to spin.">
    <div class="bg" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="frame" aria-hidden="true"></div>

    <div class="title">
      Carnival Wheel
      <div class="subtitle">Spin it. Every outcome is a yes.</div>
    </div>

    <div class="wheelWrap">
      <div class="spot" aria-hidden="true"></div>
      <div class="pointer" aria-hidden="true"></div>
      <div class="pointerCap" aria-hidden="true"></div>
      <div class="ring" aria-hidden="true"></div>

      <div class="wheel" id="wheel">
        <svg id="wheelSvg" viewBox="-200 -200 400 400" width="100%" height="100%" role="img" aria-label="Wheel">
        </svg>
      </div>

      <div class="hub" aria-hidden="true">Spin<br>Me</div>
    </div>

    <div class="panel" aria-label="Result panel">
      <p class="panelLabel">Result</p>
      <p class="panelResult" id="result">Tap Spin.</p>
    </div>

    <div class="btnHint" aria-hidden="true">Built as an HTML5 banner style unit</div>

    <div class="cta" aria-hidden="true">
      <div class="btn" id="spinBtn">Spin</div>
      <div class="btn secondary" id="resetBtn">Reset</div>
    </div>

    <canvas id="confettiCanvas"></canvas>
  </div>

  <!-- GSAP (CDN) for timeline control -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    // -----------------------
    // Banner-friendly config
    // -----------------------
    const clickTag = "https://hastonking.github.io/Spin-Wheel-Demo/"; // replace with advertiser URL if needed

    const slices = [
      "Yes, easily",
      "Yes, with style",
      "Yes, shipped it",
      "Yes, hire him",
      "Yes, interview",
      "Yes, stop overthinking",
      "Yes, whole point",
      "Yes, wheel spoke",
      "Yes, fun",
      "Yes, absolutely",
      "Yes, working",
      "Yes, undeniably"
    ];

    const colors = [
      "#e83d5b","#2f7dd8","#18b7a1","#7b4bd7",
      "#f6c35a","#ff7a2f","#3ddc97","#7a8cff",
      "#ef4a8a","#2bb3ff","#21c7b0","#a96bff"
    ];

    const ad = document.getElementById("ad");
    const wheel = document.getElementById("wheel");
    const wheelSvg = document.getElementById("wheelSvg");
    const resultEl = document.getElementById("result");
    const spinBtn = document.getElementById("spinBtn");
    const resetBtn = document.getElementById("resetBtn");

    // Confetti
    const confettiCanvas = document.getElementById("confettiCanvas");
    const cctx = confettiCanvas.getContext("2d", { alpha:true });

    let spinning = false;
    let currentRotation = 0;
    let particles = [];
    let raf = null;

    // -----------------------
    // Utilities
    // -----------------------
    function sizeCanvas(){
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const rect = ad.getBoundingClientRect();
      confettiCanvas.width = Math.floor(rect.width * dpr);
      confettiCanvas.height = Math.floor(rect.height * dpr);
      confettiCanvas.style.width = rect.width + "px";
      confettiCanvas.style.height = rect.height + "px";
      cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function polarToXY(r, angleDeg){
      const a = (angleDeg - 90) * Math.PI / 180;
      return { x: r * Math.cos(a), y: r * Math.sin(a) };
    }

    function wedgePath(r, a0, a1){
      const p0 = polarToXY(r, a0);
      const p1 = polarToXY(r, a1);
      const largeArc = (a1 - a0) > 180 ? 1 : 0;
      return [
        "M 0 0",
        "L", p0.x.toFixed(3), p0.y.toFixed(3),
        "A", r, r, 0, largeArc, 1, p1.x.toFixed(3), p1.y.toFixed(3),
        "Z"
      ].join(" ");
    }

    function addSvgEl(tag, attrs){
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    }

    function wrapLines(str, maxChars){
      const words = String(str).split(/\s+/).filter(Boolean);
      if (!words.length) return [""];
      const lines = [];
      let line = "";
      for (const w of words){
        const t = line ? (line + " " + w) : w;
        if (t.length <= maxChars){
          line = t;
        } else {
          if (line) lines.push(line);
          line = w;
        }
      }
      if (line) lines.push(line);
      return lines.slice(0, 3);
    }

    function renderWheel(){
      while (wheelSvg.firstChild) wheelSvg.removeChild(wheelSvg.firstChild);

      const n = slices.length;
      const step = 360 / n;
      const r = 190;

      wheelSvg.appendChild(addSvgEl("circle", { cx:"0", cy:"0", r:String(r), fill:"rgba(255,255,255,0.02)" }));

      for (let i = 0; i < n; i++){
        const a0 = i * step;
        const a1 = (i + 1) * step;
        const mid = a0 + step / 2;

        wheelSvg.appendChild(addSvgEl("path", {
          d: wedgePath(r, a0, a1),
          fill: colors[i % colors.length],
          style:"opacity:0.95"
        }));

        // Compact banner label rules
        const label = slices[i];
        const maxChars = 12;
        const lines = wrapLines(label, maxChars);

        const base = polarToXY(132, mid);
        const tPos = { x: base.x, y: base.y - 10 };

        const text = addSvgEl("text", {
          fill: "#140b1c",
          style: "font-weight:900;font-size:9px;letter-spacing:0.2px;",
          transform: `rotate(${mid} ${tPos.x.toFixed(3)} ${tPos.y.toFixed(3)})`,
          "text-anchor":"middle",
          "dominant-baseline":"middle"
        });

        const lineH = 8.5;
        const centerOffset = (lines.length - 1) / 2;
        lines.forEach((ln, idx) => {
          const yLine = tPos.y + (idx - centerOffset) * lineH;
          const tspan = addSvgEl("tspan", { x:String(tPos.x.toFixed(3)), y:String(yLine.toFixed(3)) });
          tspan.textContent = ln;
          text.appendChild(tspan);
        });

        wheelSvg.appendChild(text);
      }

      wheelSvg.appendChild(addSvgEl("circle", {
        cx:"0", cy:"0", r:String(r),
        fill:"none",
        style:"stroke:rgba(0,0,0,0.35);stroke-width:4"
      }));
    }

    function norm360(deg){
      return ((deg % 360) + 360) % 360;
    }

    function getLandedIndex(rotationDeg){
      const n = slices.length;
      const step = 360 / n;
      const wheelAngleAtPointer = norm360(-rotationDeg);
      return Math.max(0, Math.min(n - 1, Math.floor(wheelAngleAtPointer / step)));
    }

    // -----------------------
    // Confetti (lightweight for banners)
    // -----------------------
    function clearConfetti(){
      particles = [];
      if (raf) cancelAnimationFrame(raf);
      raf = null;
      cctx.clearRect(0,0,300,250);
      tick._last = undefined;
    }

    function launchConfetti(){
      const prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (prefersReduced) return;

      // Keep it banner-friendly: fewer particles
      const palette = ["#fff3d6","#f6c35a","#e83d5b","#2f7dd8","#18b7a1","#7b4bd7"];
      const count = 120;

      for (let i=0;i<count;i++){
        const side = (i % 2 === 0) ? 0 : 1;
        const x0 = side ? 290 : 10;
        const y0 = 248;

        const angle = (-Math.PI / 2) + (Math.random()*0.9 - 0.45);
        const speed = 520 + Math.random()*520;

        const vx = Math.cos(angle) * speed * (side ? -1 : 1);
        const vy = Math.sin(angle) * speed;

        particles.push({
          x:x0, y:y0,
          vx, vy,
          w: 3 + Math.random()*4,
          h: 4 + Math.random()*6,
          rot: Math.random()*Math.PI*2,
          vr: (Math.random()*2 - 1) * 8,
          color: palette[Math.floor(Math.random()*palette.length)],
          settled:false
        });
      }

      if (!raf){
        tick(performance.now());
        raf = requestAnimationFrame(tick);
      }
    }

    function drawParticle(p){
      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      cctx.restore();
    }

    function tick(now){
      const last = tick._last ?? now;
      const dt = Math.min(0.033, Math.max(0.001, (now - last)/1000));
      tick._last = now;

      const W = 300, H = 250;
      const floorY = 246;

      const gravity = 1100;
      const drag = 0.985;
      const groundFriction = 0.70;

      cctx.clearRect(0,0,W,H);

      let anyMoving = false;

      for (const p of particles){
        if (!p.settled){
          anyMoving = true;

          p.vy += gravity * dt;
          p.vx *= Math.pow(drag, dt*60);
          p.vy *= Math.pow(drag, dt*60);

          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.rot += p.vr * dt;

          if (p.x < -20) { p.x = -20; p.vx *= -0.25; }
          if (p.x > W + 20) { p.x = W + 20; p.vx *= -0.25; }

          if (p.vy > 0 && p.y >= floorY){
            p.y = floorY;
            p.vy = 0;
            p.vx *= groundFriction;
            p.vr *= 0.35;
            if (Math.abs(p.vx) < 10) p.settled = true;
          }
        }
        drawParticle(p);
      }

      if (anyMoving){
        raf = requestAnimationFrame(tick);
      } else {
        raf = null;
      }
    }

    // -----------------------
    // GSAP timeline
    // -----------------------
    function spin(){
      if (spinning) return;
      spinning = true;

      const n = slices.length;
      const step = 360 / n;

      const chosen = Math.floor(Math.random()*n);

      // Keep away from boundaries for a clean land
      const safety = step * 0.18;
      const minA = chosen*step + safety;
      const maxA = (chosen+1)*step - safety;

      const u = Math.random();
      const biased = 0.5 + 0.5 * Math.sin((u - 0.5) * Math.PI * 0.9);
      const targetAngle = minA + (maxA - minA) * biased;

      const offset = 0 - targetAngle;
      const extraSpins = 5 + Math.floor(Math.random()*2);
      const targetRotation = currentRotation + extraSpins*360 + offset;
      currentRotation = targetRotation;

      resultEl.textContent = "Spinning...";

      // Small UI bump on spin
      gsap.killTweensOf(wheel);
      gsap.killTweensOf(resultEl);

      const tl = gsap.timeline({
        defaults:{ ease:"power3.out" },
        onComplete: () => {
          spinning = false;

          const landed = getLandedIndex(currentRotation);
          resultEl.textContent = slices[landed];

          // Confetti after landing
          launchConfetti();

          // Tiny result pop
          gsap.fromTo(resultEl, { scale: 0.98, opacity:0.88 }, { scale:1, opacity:1, duration:0.25, ease:"power2.out" });
        }
      });

      tl.to(wheel, { rotation: targetRotation, duration: 3.2, ease: "power4.out" }, 0);
      tl.fromTo(".hub", { scale:1 }, { scale:1.03, duration:0.2, yoyo:true, repeat:1 }, 0.1);
    }

    function reset(){
      spinning = false;
      currentRotation = 0;
      resultEl.textContent = "Tap Spin.";
      gsap.killTweensOf(wheel);
      gsap.set(wheel, { rotation: 0 });
      clearConfetti();
    }

    // -----------------------
    // Click handling (banner pattern)
    // -----------------------
    function handleClick(e){
      const t = e.target;
      if (t === spinBtn) { spin(); return; }
      if (t === resetBtn) { reset(); return; }

      // Click-through
      window.open(clickTag, "_blank", "noopener,noreferrer");
    }

    // Keyboard access
    function handleKey(e){
      if (e.key === "Enter" || e.key === " "){
        e.preventDefault();
        spin();
      }
    }

    // Init
    renderWheel();
    sizeCanvas();
    window.addEventListener("resize", sizeCanvas);

    ad.addEventListener("click", handleClick);
    ad.addEventListener("keydown", handleKey);

    // Make the buttons feel clickable even though the whole ad is clickable
    spinBtn.style.pointerEvents = "auto";
    resetBtn.style.pointerEvents = "auto";
    spinBtn.addEventListener("click", (e) => { e.stopPropagation(); spin(); });
    resetBtn.addEventListener("click", (e) => { e.stopPropagation(); reset(); });

    // Optional auto-attention animation (
